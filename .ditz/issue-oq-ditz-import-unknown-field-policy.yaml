  comment: 'The beads export the migration rehearsal used has top-level keys the importer
    silently drops: comments (53 records), design (4 records, genuine prose content
    loss), started_at, spec_id, lease_expires_at, heartbeat_at, _type, comment_count/dependency_count/dependent_count,
    and metadata on all 432 dependency objects. Recommendation from the source session:
    warning with non-zero exit, with an explicit known-but-unmapped allowlist so fields
    like _type/lease_expires_at stay quiet. Sub-decision: add an --allow-unknown-fields
    escape hatch, or should schema drift always stop the operator? Decides: Ted. Source:

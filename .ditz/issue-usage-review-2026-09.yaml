id: usage-review-2026-09
title: 'Usage review 2026-09: how agents use ditz (findings index)'
desc: 'RECORD of the 2026-09-13/14 review of real ditz use, so the evidence survives
  the session. Actionable items are filed as separate issues (below).

  SOURCES: Claude and Codex transcripts on tower0 and framework0 (framework0 holds
  most real use: 169 swarm-ide/goals Codex sessions with ~3,400 invocations; 42 Claude
  sessions with ~590); Gemini/agy logs (council reviews only); discord-agents daemon
  logs (80-char previews only); ditz trackers in ditz, dotfiles, pairmarket, website;
  beads data in goals, predictionbook, puresky, website, dotfiles. Scratch scripts
  (ephemeral /tmp): tower0 /tmp/ditz_mine, /tmp/ditz_prose; framework0 /tmp/ditz_mine_fw_claude,
  /tmp/ditz_mine_fw_codex.

  RANKED (count = evidence):

  1. No write lock: lost updates (12 parallel comments kept 1), index.lock collisions
  (6 in pairmarket), swarm-ide banning child writes (19 prompts) -> write-lock-recheck
  (PR #32)

  2. Unknown list -s/-t values silently return everything (5 real, 1 false "confirmed
  working") -> list-filter-validation (PR #29)

  3. Re-add with a new title silently dropped (2 real, 8 rewrites lost; ~70 ensure-exists
  handoffs) -> PR #27 docs + readd-mismatch-warning

  4. sync says only "Synced" (~170 raw-git verification calls across ~60 sessions;
  unnoticed drift) -> sync-status-visibility (PR #31, which also fixes sync never
  pulling without a fetch refspec)

  5. Readable default ids / rename (operator: "why am I seeing git hashes?") -> decision-readable-default-ids

  6. Writes should return resulting state as JSON (~100 show|jq checks after writes):
  NOT FILED, ask operator

  7. Flag guesses: --description 11, `ditz help` 19, -t as title 4 -> cli-aliases-help

  8. Output size / --limit / count (approved 06-14, never built); hide closed by default?
  -> decision-hide-closed-limit-count

  9. Slow `nix run` invocations from stale docs (49); Ruby-era AGENTS.md (18 wrong-binary
  failures); bd instructions in unmigrated repos -> docs-nix-run-instructions, docs-pairmarket-ruby-agents-md,
  docs-bd-instructions-unmigrated, binary-cache-publish

  10. Stale open issues; operator asked for a sweep agent: NOT FILED, ask operator

  11. Single identity (1,369 swarm-ide log events all "Ted Smith"; 404/854 comments
  hand-labelled) -> decision-per-agent-attribution

  12. Commit messages on metadata branches are ~95% "ditz: update issue": NOT FILED,
  ask operator

  Design cuts held up: nobody asked for priority/assignee; epics-as-blocks works (but
  see dotfiles inversion in tracker-cleanup-2026-09); labels are used only in beads
  data (goals/predictionbook).

  Also found: add --id data-loss bug -> PR #28 (land-id-docs-stack).'

id: oq-ergonomics-result-contract
title: 'Q: Approve an additive versioned machine result for mutations?'
desc: 'Options: (A) keep existing JSON plus recipes, (B) add opt-in --output json-v1
  with consistent per-item results/errors and resulting changed fields, (C) change
  existing --json. Recommend B after storage safety, preserving existing bare --json
  and mutation semantics. Define committed/saved persistence, exact local head, effect
  none versus unknown on errors, parser exit124 exceptions, and existing-ID comparison
  when stdin is not read. No exactly-once claim or request registry. Owner: Ted. Blocks:
  report slice5. Evidence: report G2/G3; current set --json omits desc, comment returns
  boolean/id, one sampled call rereads four created issues. Existing September review
  item6 proposed returned state but was explicitly not filed. Acceptance: mixed-ID
  results, unreadable store, rollback failure, repeated close/comment, loss of output,
  and compatibility. Research only; implementation requires ruling. See docs/agent-ergonomics-investigation-20261002.md
  Q1. Evidence report: https://github.com/tedks/ditz/pull/34.'

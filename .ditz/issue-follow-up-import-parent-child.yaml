id: follow-up-import-parent-child
title: 'importer: natively convert beads parent-child deps to ditz edges'
desc: 'ditz import only converts beads ''blocks'' deps to edges; ''parent-child''
  dropped to provenance with no edge, losing epic+subtask hierarchy. Workaround in
  dotfiles cutover: pre-rewrite parent-child into a sibling ''blocks'' dep. Proposal:
  import parent-child natively (parent blocks child, matching beads depends_on), noting
  original type in provenance.'

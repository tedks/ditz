  comment: 'Nothing in the import-fidelity plan proceeds without this. Two successive
    read-only sessions (Codex forensics, then Claude Opus) produced a recommended
    5-PR stack off master: import-unknown-fields, import-comments, relates-to, dotted-ids,
    import-parity, in that order so each later PR''s fix appears as a warning that
    disappears. Neither session was authorized to write code, create branches/worktrees,
    or file/edit tracker issues beyond this handoff. Options: authorize the full stack,
    authorize a subset, or decline for now (Ted previously withdrew Q10/Q3 and retained
    beads as authoritative once already, canceling a related migration effort E4).
    Recommendation: the stack above, per the source shard. Decides: Ted. Blocks: all
    other import-fidelity sub-decisions (see follow-up-import-comments, follow-up-import-dotted-ids,
    land-id-docs-stack, oq-ditz-import-unknown-field-policy). Source: off-duty/waiting/2026-09-26-eb50d85c-ditz-import-fidelity-plan.md
    and off-duty/waiting/2026-09-26-01a0b018-ditz-migration-rehearsal.md.'

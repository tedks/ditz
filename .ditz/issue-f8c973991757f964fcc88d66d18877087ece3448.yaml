title: init writes AGENTS.md with mode 600
desc: 'The onboarding block written by `ditz init` created AGENTS.md as -rw-------
  rather than -rw-r--r--. Noticed in the goals migration, where sibling files are
  664 and git records 100644 for AGENTS.md.


  Git does not track the read bits, so this causes no diff, but it is surprising for
  a file every agent and contributor reads, and it would matter for anything serving
  the repo directly.'

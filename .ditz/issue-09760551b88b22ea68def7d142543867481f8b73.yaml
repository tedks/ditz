title: 'import: dotted beads sub-issue IDs are silently skipped, dropping epic subtasks'
desc: "Hit this migrating tedks/website from beads to ditz today.\n\nbeads gives epic
  subtasks dotted IDs: an epic `website-mrb` (\"Build\nchaos.online corporate site\")
  has subtasks `website-mrb.1` .. `website-mrb.9`.\n`ditz import` rejects any ID containing
  a `.` and skips it with\n`warning: skipped invalid issue id '<id>'` \u2014 no error,
  no non-zero exit,\njust silently missing data.\n\nReal numbers from the website
  repo's `bd export`: 107 issues total, 23\nimported, 84 skipped. Of the 84 skipped,
  30 were still `open` (i.e. active,\nundone work) spanning 12 epics. The 12 epic
  issues themselves imported fine\n(their own IDs have no dot); only their subtasks
  vanished. Net effect: after\nimport, every epic looks empty even though most of
  its checklist is still\noutstanding \u2014 a silent, large-magnitude data loss on
  the single most common\nbeads shape (an epic with subtasks), not an edge case.\n\nSuggested
  fix: don't reject dotted IDs outright. Either (a) accept the beads\nID as-is (ditz
  IDs are opaque strings elsewhere, e.g. `phase6-sync`,\n`follow-up-ci-concurrency`
  already contain `-`; nothing in the format doc\nrequires excluding `.`), or (b)
  sanitize on import (e.g. `.` -> `-`) and\npreserve the epic/subtask relationship
  via `blocks`/`blocked_by` so the\nhierarchy survives as a dependency edge instead
  of disappearing. Whichever\nis chosen, `ditz import` should report a per-run summary
  distinguishing\n\"skipped: unsupported ID shape\" from \"skipped: already present\"
  -- right now\nboth look like routine no-op skips in the output, which is how 84
  dropped\nissues went unnoticed until someone counted by hand."

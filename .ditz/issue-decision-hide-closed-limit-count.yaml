  comment: 'Ergonomics investigation Q3: retain this existing issue, do not duplicate
    it. Preserve explicit default closed visibility. Recommend additive limit/count,
    deterministic list ID ordering and ready rank/age/ID tie-break, limit0 valid,
    count unbounded by limit; no implicit caps/pagination. Existing June approval
    of limit/count acknowledged; ordering and incomplete-scan compatibility need explicit
    acceptance. Evidence G2/prior study; synthetic baseline rejects --limit124. Coordinate

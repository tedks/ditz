id: build-revision-provenance
title: Expose installed ditz build revision and installation provenance
desc: Deferred from October2 agent ergonomics follow-on, not implemented. Current
  --version is hardcoded0.1.0-ocaml, so agents cannot distinguish newer source behavior
  from a stale installed binary using version alone. Propose build revision/provenance
  and a documented pinned installation workflow. Determine stable output/fallback
  behavior before implementation; preserve reproducible Nix builds. Existing docs
  require comparing installed command help with source. No release/deployment authorized
  by this issue.

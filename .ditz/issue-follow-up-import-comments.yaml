id: follow-up-import-comments
title: 'importer: preserve beads issue comments on import'
desc: "ditz import drops beads 'comments' arrays entirely \u2014 not migrated into
  log_events. Lost in the dotfiles migration: council trail on dotfiles-xnm, btrfs
  context on dotfiles-anj, sm-* notes. Only priority/labels/updated_at + dep provenance
  kept. Proposal: map each beads comment to a ditz log_event (what=commented, author
  + created_at + text)."
type: feature
component: default
release:
reporter: Test User <test@example.com>
status: unstarted
disposition:
creation_time: 2026-07-17T16:56:09-00:00
references: []
log_events:
- time: 2026-07-17T16:56:09-00:00
  who: Test User
  what: created
  comment: ""
- time: 2026-09-26T19:43:15-00:00
  who: Ted Smith
  what: commented
  comment: 'Successor shard off-duty/waiting/2026-09-26-eb50d85c-ditz-import-fidelity-plan.md
    sharpens this into a concrete open decision: storing the source comment UUID requires
    an optional field on log_event (a schema change), but without it a re-import cannot
    dedup comments; the shard recommends adding it. Coupled sub-decision: should import
    become additive on already-present issues (merging in new comments, as it already
    completes edges), or stay strict-skip? Verified schema facts: 53 of 649 beads
    records carry a comments array, 86 comments total with keys {id, issue_id, author,
    created_at, text}, id values are UUIDs; comment_count is present on all 649 records
    and equals len(comments) on every one, a free parity check the importer could
    use. Decides: Ted. Source also: off-duty/waiting/2026-09-26-01a0b018-ditz-migration-rehearsal.md.'

name: CI

on:
  pull_request:
  push:
    branches: [master]

# Supersede in-flight runs for the same ref (a new push cancels the old run);
# never cancel master pushes (each populates the shared nix cache).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    # Cold toolchain build is ~15 min; headroom over a warm-cache ~5 min run and
    # a backstop against a hung step.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # Cache /nix/store across runs — the opam-nix toolchain is a cold
      # compile of the OCaml compiler (~15 min) without it.
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'ocaml/ditz.opam') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      # git_test commits to temp repos; commits need an identity.
      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@invalid.example"

      - name: Build
        run: nix develop --command bash -c 'cd ocaml && dune build'

      - name: Test
        run: nix develop --command bash -c 'cd ocaml && dune runtest'
